<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation</title>
</head>
<body>

<h2>Registration Form</h2>


<label>Name:</label><br>
<input type="text" id="name" onchange="checkName()">
<span id="nameError"></span>
<br><br>


<label>Email:</label><br>
<input type="text" id="email" onchange="checkEmail()">
<span id="emailError"></span>
<br><br>

<label>Age:</label><br>
<input type="number" id="age" onchange="checkAge()">
<span id="ageError"></span>
<br><br>


<button onclick="storeData()">Register</button>

<p id="result"></p>

<script>

function checkName(){
  let name = document.getElementById("name").value;

  if(name === ""){
    document.getElementById("nameError").innerText = "Name cannot be empty";
  } else {
    document.getElementById("nameError").innerText = "Valid name";
  }
}

function checkEmail(){
  let email = document.getElementById("email").value;

  if(email.includes("@")){
    document.getElementById("emailError").innerText = "Valid mail";
  } else {
    document.getElementById("emailError").innerText = "Email must contain @";
  }
}

function checkAge(){
  let age = document.getElementById("age").value;

  if(age > 18){
    document.getElementById("ageError").innerText = "Valid Age";
  } else {
    document.getElementById("ageError").innerText = "Age must be greater than 18";
  }
}

function storeData(){

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let age = document.getElementById("age").value;

  if(name !== "" && email.includes("@") && age > 18){

    let user = {
      name: name,
      email: email,
      age: age
    };

    sessionStorage.setItem("user", JSON.stringify(user));

    document.getElementById("result").innerText =
      " Data stored in sessionStorage";
  }
  else{
    document.getElementById("result").innerText =
      " Please enter valid details";
  }
}

</script>

</body>
</html>
